<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投研仪表盘 · 基于财经大V</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --border: #2a2d37; --text: #e1e4ea; --sub: #8b8fa3;
    --shanren: #f59e0b; --eda: #3b82f6; --maoda: #10b981;
    --red: #ef4444; --green: #22c55e;
    --panel-bg: #141720;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh; }
  .header { text-align:center; padding:28px 16px 12px; border-bottom:1px solid var(--border); }
  .header h1 { font-size:22px; margin-bottom:4px; }
  .header .sub { color:var(--sub); font-size:12px; }

  /* Market bar */
  .top-row { max-width:900px; margin:10px auto 0; padding:0 12px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:700px) { .top-row { grid-template-columns:1fr; } }
  .top-section { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
  .top-title { font-size:11px; font-weight:600; color:var(--sub); margin-bottom:6px; }
  .markets-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px; background:var(--border); border-radius:4px; overflow:hidden; }
  .m-item { background:var(--card); padding:5px 6px; }
  .m-item .m-name { font-size:9px; color:var(--sub); }
  .m-item .m-price { font-size:13px; font-weight:700; line-height:1.2; }
  .m-item .m-chg { font-size:9px; }
  .mr-up { color:var(--red); } .mr-down { color:var(--green); }
  .pf-row { display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:11px; }
  .pf-row:last-child { border-bottom:none; }
  .pf-name { color:var(--text); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pf-pnl { flex-shrink:0; margin-left:8px; font-weight:600; }
  .pf-pnl-up { color:var(--red); } .pf-pnl-down { color:var(--green); }
  .pf-hidden { display:none !important; }
  .market-summary { display:none; }
  .signal-bar { max-width:500px; margin:8px auto 0; padding:0 12px; display:flex; gap:6px; }
  .signal-item { flex:1; background:var(--card); border:1px solid var(--border); border-radius:6px; padding:8px 10px; text-align:center; }
  .signal-item .s-emoji { font-size:14px; }
  .signal-item .s-label { font-size:10px; color:var(--sub); }
  .signal-item .s-value { font-size:12px; font-weight:600; margin-top:2px; }
  .s-bullish { border-left:2px solid var(--red); }
  .s-cautious { border-left:2px solid #f59e0b; }
  .s-bearish { border-left:2px solid var(--green); }
  .consensus-box { max-width:500px; margin:6px auto 0; padding:0 12px; text-align:center; font-size:12px; }
  .consensus-box .dot-row { display:flex; justify-content:center; gap:6px; margin-bottom:4px; }
  .c-dot { width:10px; height:10px; border-radius:50%; }
  .c-green { background:var(--green); }
  .c-red { background:var(--red); }
  .c-yellow { background:#f59e0b; }
  .c-gray { background:#555; }
  .refresh-row { max-width:500px; margin:6px auto 0; padding:0 12px; text-align:center; }
  .btn-sm { padding:4px 14px; border:1px solid var(--border); border-radius:4px; background:var(--card); color:var(--text); cursor:pointer; font-size:11px; }
  .relevance-card { max-width:500px; margin:10px auto 0; padding:0 12px; }
  .rel-inner { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 14px; }
  .rel-title { font-size:12px; font-weight:600; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .rel-holding { font-size:11px; color:var(--sub); margin-bottom:8px; }
  .rel-row { display:flex; align-items:flex-start; gap:6px; padding:4px 0; font-size:12px; border-bottom:1px solid rgba(255,255,255,0.03); }
  .rel-row:last-child { border-bottom:none; }
  .rel-emoji { flex-shrink:0; width:22px; }
  .rel-action { flex:1; }
  .rel-tag { font-size:10px; padding:1px 5px; border-radius:3px; flex-shrink:0; }
  .rt-hold { background:rgba(139,143,163,0.15); color:#9ca3af; }
  .rt-wait { background:rgba(245,158,11,0.15); color:#fbbf24; }
  .rt-act { background:rgba(34,197,94,0.12); color:#4ade80; }
  .rt-warn { background:rgba(239,68,68,0.12); color:#f87171; }

  /* Tabs */
  .tabs { display:flex; justify-content:center; gap:4px; padding:16px 16px 0; max-width:1500px; margin:0 auto; }
  .tab { padding:10px 22px; border:1px solid var(--border); border-radius:8px 8px 0 0; background:var(--card); color:var(--sub); cursor:pointer; font-size:14px; transition:all 0.2s; border-bottom:none; }
  .tab.active { color:var(--text); border-color:var(--border); background:var(--panel-bg); }
  .tab.shanren.active { border-top:2px solid var(--shanren); }
  .tab.eda.active { border-top:2px solid var(--eda); }
  .tab.maoda.active { border-top:2px solid var(--maoda); }
  .tab .emoji { margin-right:4px; }

  /* Content */
  .content { max-width:1500px; margin:0 auto; padding:0 16px 32px; }
  .blogger-panel { display:none; background:var(--panel-bg); border:1px solid var(--border); border-top:none; border-radius:0 0 12px 12px; padding:20px; }
  .blogger-panel.active { display:block; }

  /* 4 panels in 2x2 */
  .panels-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:900px) { .panels-grid { grid-template-columns:1fr; } }

  .panel { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:18px; }
  .panel.full-width { grid-column:1/-1; }
  .panel h3 { font-size:13px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
  .panel h3 .dot { width:8px; height:8px; border-radius:50%; }

  /* Panel 1: Narrative */
  .logic-chain { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .logic-step { display:flex; align-items:flex-start; gap:8px; font-size:13px; }
  .logic-step .tag { flex-shrink:0; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:600; }
  .tag-fact { background:rgba(59,130,246,0.15); color:#60a5fa; }
  .tag-logic { background:rgba(245,158,11,0.15); color:#fbbf24; }
  .tag-conclusion { background:rgba(16,185,129,0.15); color:#34d399; }
  .keywords { display:flex; flex-wrap:wrap; gap:4px; margin:8px 0; }
  .kw { padding:3px 8px; border-radius:12px; font-size:11px; background:rgba(255,255,255,0.05); border:1px solid var(--border); }
  .tone-badge { display:inline-block; padding:3px 10px; border-radius:4px; font-size:11px; font-weight:600; }
  .tone-cautious { background:rgba(245,158,11,0.15); color:#fbbf24; }
  .tone-bullish { background:rgba(239,68,68,0.15); color:#f87171; }
  .tone-neutral { background:rgba(139,143,163,0.15); color:#9ca3af; }

  /* Panel 2: Evidence */
  .verify-row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:13px; }
  .verify-row:last-child { border-bottom:none; }
  .verify-claim { flex:1; }
  .verify-result { flex-shrink:0; font-size:11px; font-weight:600; padding:2px 8px; border-radius:4px; }
  .v-match { background:rgba(34,197,94,0.12); color:#4ade80; }
  .v-conflict { background:rgba(239,68,68,0.12); color:#f87171; }
  .v-unknown { background:rgba(139,143,163,0.12); color:#9ca3af; }
  .fallacy-item { padding:6px 0; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.04); }
  .fallacy-item:last-child { border-bottom:none; }
  .fallacy-tag { font-size:10px; padding:1px 6px; border-radius:3px; margin-right:6px; }
  .ft-survivor { background:rgba(239,68,68,0.12); color:#f87171; }
  .ft-sample { background:rgba(245,158,11,0.12); color:#fbbf24; }
  .ft-drift { background:rgba(59,130,246,0.12); color:#60a5fa; }

  /* Panel 3: Scenarios */
  .scenario { padding:8px 12px; border-radius:8px; margin-bottom:8px; border-left:3px solid; font-size:13px; }
  .sc-a { border-left-color:#34d399; background:rgba(34,197,94,0.05); }
  .sc-b { border-left-color:#f87171; background:rgba(239,68,68,0.05); }
  .sc-c { border-left-color:#fbbf24; background:rgba(245,158,11,0.05); }
  .scenario .sc-title { font-weight:600; margin-bottom:3px; }
  .trigger-box { padding:10px 14px; background:rgba(59,130,246,0.06); border:1px solid rgba(59,130,246,0.2); border-radius:8px; font-size:13px; margin-top:10px; }

  /* Panel 4: Synthesis */
  .synth-row { display:flex; gap:12px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:13px; align-items:flex-start; }
  .synth-row:last-child { border-bottom:none; }
  .synth-label { flex-shrink:0; width:70px; font-size:11px; color:var(--sub); padding-top:2px; }

  /* Footer */
  .footer { text-align:center; padding:8px 16px 24px; color:var(--sub); font-size:11px; }

  .spinner { text-align:center; padding:60px; color:var(--sub); }
</style>
</head>
<body>

<div class="header">
  <h1>投研仪表盘 · 基于财经大V</h1>
  
</div>

<!-- Top Row: Markets + Portfolio -->
<div class="top-row">
  <div class="top-section" id="marketsBox">
    <div class="top-title">全球指数</div>
    <div class="markets-grid" id="marketsGrid"></div>
  </div>
  <div class="top-section" id="portfolioBox">
    <div class="top-title">我的持仓</div>
    <div id="portfolioGrid"></div>
  </div>
</div>

<!-- Relevance -->
<div class="relevance-card" id="relevanceCard"></div>

<!-- Refresh -->
<div class="refresh-row">
  <button class="btn-sm" onclick="liveRefresh()" id="refreshBtn">🔄 实时刷新行情</button>
  <span style="font-size:10px;color:var(--sub);margin-left:8px;" id="refreshNote">点击获取实时指数+更新持仓收益</span>
</div>

<!-- Tabs -->
<div class="tabs" id="tabs"></div>

<!-- Content -->
<div class="content" id="content"></div>

<div class="footer">基于公开言论提炼 · 不构成投资建议 · <span id="footerTime"></span></div>

<script>
const DATA_URL = './data.json';

const PANEL_COLORS = { shanren: '#f59e0b', eda: '#3b82f6', maoda: '#10b981' };
const PANEL_LABELS = { shanren: '山人I', eda: 'ETF拯救世界', maoda: '猫大' };

function renderRelevance(relevance) {
  if (!relevance) return;
  const tagClass = { hold: 'rt-hold', wait: 'rt-wait', act: 'rt-act', warn: 'rt-warn' };
  const tagText = { hold: '持有', wait: '等待', act: '可操作', warn: '注意' };
  document.getElementById('relevanceCard').innerHTML = `
    <div class="rel-inner">
      <div class="rel-title">📌 与我相关</div>
      <div class="rel-holding">当前持仓：${relevance.holdings||'暂无'}</div>
      ${(relevance.items||[]).map(item => `
        <div class="rel-row">
          <span class="rel-emoji">${item.emoji}</span>
          <span class="rel-action">${item.text}</span>
          <span class="rel-tag ${tagClass[item.tag]||'rt-hold'}">${tagText[item.tag]||''}</span>
        </div>
      `).join('')}
    </div>`;
}

function renderSignals(signals, consensus) {
  if (!signals) return;
  document.getElementById('signalBar').innerHTML = signals.map(s => {
    const cls = s.signal === 'bullish' ? 's-bullish' : s.signal === 'cautious' ? 's-cautious' : 's-bearish';
    return `<div class="signal-item ${cls}">
      <div class="s-emoji">${s.emoji}</div>
      <div class="s-label">${s.name}</div>
      <div class="s-value">${s.stance}</div>
    </div>`;
  }).join('');
  if (consensus) {
    const dots = { bullish: 'c-red', cautious: 'c-yellow', bearish: 'c-green', neutral: 'c-gray' };
    const d = consensus.dots || [];
    document.getElementById('consensusBox').innerHTML = `
      <div class="dot-row">${d.map(x => `<span class="c-dot ${dots[x]||'c-gray'}"></span>`).join('')}</div>
      <div>${consensus.text}</div>`;
  }
}

function renderMarkets(markets, summary) {
  const items = Array.isArray(markets) ? markets : [];
  if (!items.length) return;
  document.getElementById('marketsGrid').innerHTML = items.map(m => {
    const down = (m.chgp||'').startsWith('-');
    const cls = down ? 'mr-down' : 'mr-up';
    return `<div class="m-item">
      <div class="m-name">${m.name}</div>
      <div class="m-price">${m.price||'--'}</div>
      <div class="m-chg ${cls}">${m.chg||''} ${m.chgp||''}</div>
    </div>`;
  }).join('');
}

function renderPortfolio(portfolio) {
  const items = portfolio || [];
  if (!items.length) return;
  // Group items into categories
  const groups = [];
  let cur = null;
  items.forEach(p => {
    if (!p.name.startsWith('　')) { cur = {cat:p, subs:[]}; groups.push(cur); }
    else if (cur) { cur.subs.push(p); }
  });
  document.getElementById('portfolioGrid').innerHTML = `
    <div class="pf-row" style="font-size:10px;color:var(--sub);font-weight:600;border-bottom:1px solid var(--border);">
      <span class="pf-name">品种</span>
      <span style="min-width:50px;text-align:right;">金额</span>
      <span style="min-width:50px;text-align:right;">收益率</span>
    </div>
    ${groups.map((g, i) => {
      const down = (g.cat.pnl||'').startsWith('-');
      const cls = down ? 'pf-pnl-down' : 'pf-pnl-up';
      const id = 'pfg_' + i;
      return `
      <div class="pf-row pf-cat" style="font-weight:600;cursor:pointer;" onclick="t('${id}',this)">
        <span class="pf-name pf-arrow">▸ ${g.cat.name}</span>
        <span style="font-size:11px;min-width:50px;text-align:right;">${g.cat.amount||'--'}</span>
        <span class="pf-pnl ${cls}" style="min-width:50px;text-align:right;">${g.cat.pnl||'--'}</span>
      </div>
      <div id="${id}" style="display:none;">
        ${g.subs.map(s => {
          const sd = (s.pnl||'').startsWith('-');
          const scls = sd ? 'pf-pnl-down' : 'pf-pnl-up';
          return `<div class="pf-row" style="font-size:10px;">
            <span class="pf-name" style="color:var(--sub);padding-left:12px;">${s.name.replace('　','')}</span>
            <span style="font-size:10px;color:var(--sub);min-width:50px;text-align:right;">${s.amount||'--'}</span>
            <span class="pf-pnl ${scls}" style="min-width:50px;text-align:right;">${s.pnl||'--'}</span>
          </div>`;
        }).join('')}
      </div>`;
    }).join('')}`;
}

function renderKeywords(kws) { return (kws||[]).map(k => `<span class="kw">${k}</span>`).join(''); }
function toneClass(t) { return t==='审慎'?'tone-cautious':t==='亢奋'?'tone-bullish':'tone-neutral'; }

function renderPanel1(d) {
  const logic = d.logic_chain || [];
  return `
    <div class="panel">
      <h3><span class="dot" style="background:${PANEL_COLORS[d.key]}"></span>大V观点拆解 · The Narrative Layer</h3>
      <div style="font-size:13px;color:var(--sub);margin-bottom:10px;">纯粹提取对方说了什么，不加评价</div>
      <div class="logic-chain">
        ${logic.map(s => `<div class="logic-step"><span class="tag tag-${s.type}">${s.type==='fact'?'事实':s.type==='logic'?'逻辑':'结论'}</span><span>${s.text}</span></div>`).join('')}
      </div>
      <div style="margin-top:10px;"><strong style="font-size:12px;">叙事关键词：</strong><div class="keywords">${renderKeywords(d.keywords)}</div></div>
      <div style="margin-top:8px;"><strong style="font-size:12px;">情绪基调：</strong><span class="tone-badge ${toneClass(d.tone)}">${d.tone||'中性'}</span></div>
    </div>`;
}

function renderPanel2(d) {
  const verif = d.verifications || [];
  const fallacies = d.fallacies || [];
  return `
    <div class="panel">
      <h3><span class="dot" style="background:${PANEL_COLORS[d.key]}"></span>AI独立投研审查 · Evidence-Based Review</h3>
      <div style="font-size:13px;color:var(--sub);margin-bottom:10px;">去噪后的专业评估</div>
      <div style="font-size:12px;font-weight:600;margin-bottom:6px;">数据交叉校验</div>
      ${verif.map(v => `<div class="verify-row"><span class="verify-claim">${v.claim}</span><span class="verify-result ${v.result==='一致'?'v-match':v.result==='冲突'?'v-conflict':'v-unknown'}">${v.result}</span></div>`).join('')}
      ${fallacies.length ? `<div style="font-size:12px;font-weight:600;margin:12px 0 6px;">逻辑漏洞审查 (Red Teaming)</div>` : ''}
      ${fallacies.map(f => `<div class="fallacy-item"><span class="fallacy-tag ${f.type==='幸存者偏差'?'ft-survivor':f.type==='样本量'?'ft-sample':'ft-drift'}">${f.type}</span>${f.text}</div>`).join('')}
      ${d.relevance ? `<div style="font-size:12px;font-weight:600;margin:12px 0 6px;">相关性分析</div><div style="font-size:13px;">${d.relevance}</div>` : ''}
    </div>`;
}

function renderPanel3(d) {
  const sc = d.scenarios || {};
  return `
    <div class="panel">
      <h3><span class="dot" style="background:${PANEL_COLORS[d.key]}"></span>压力测试 · Stress Test</h3>
      <div style="font-size:13px;color:var(--sub);margin-bottom:10px;">大V观点在三种市场环境下的表现推演</div>
      <div class="scenario sc-a"><div class="sc-title">验证成功</div>${sc.a||'暂无'}</div>
      <div class="scenario sc-b"><div class="sc-title">验证失败</div>${sc.b||'暂无'}</div>
      <div class="scenario sc-c"><div class="sc-title">中性/模糊</div>${sc.c||'暂无'}</div>
      ${d.triggers ? `<div class="trigger-box"><strong>决策锚点 (Trigger Events)：</strong>${d.triggers}</div>` : ''}
    </div>`;
}

function renderPanelLive(d) {
  const posts = d.live_posts || [];
  if (!posts.length) return '';
  return `
    <div class="panel full-width">
      <h3><span class="dot" style="background:${PANEL_COLORS[d.key]}"></span>大V实时观点 · Latest Posts</h3>
      <div style="font-size:11px;color:var(--sub);margin-bottom:8px;">最新3条财经原创微博（已过滤非投资内容）</div>
      ${posts.map(p => `
        <div class="rel-row" style="padding:5px 0;">
          <span style="font-size:10px;color:var(--sub);min-width:55px;flex-shrink:0;">${p.time}</span>
          <span style="font-size:10px;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,0.04);min-width:40px;text-align:center;flex-shrink:0;margin-right:6px;">${p.tag||''}</span>
          <span style="font-size:12px;flex:1;line-height:1.4;">${p.text}</span>
        </div>
      `).join('')}
    </div>`;
}

function renderPanel5(d) {
  const recs = d.recommendations || [];
  return `
    <div class="panel full-width">
      <h3><span class="dot" style="background:${PANEL_COLORS[d.key]}"></span>大V建议 · Actionable Intelligence</h3>
      <div style="font-size:13px;color:var(--sub);margin-bottom:10px;">基于该大V最新观点的实时操作参考</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        ${recs.map(r => {
          const aMap = { buy:'rt-act', sell:'rt-warn', hold:'rt-hold', wait:'rt-wait' };
          const aText = { buy:'买入', sell:'卖出', hold:'持有', wait:'等待' };
          return `<div class="rel-row" style="background:rgba(255,255,255,0.02);padding:6px 8px;border-radius:4px;">
            <span style="font-size:13px;flex:1;">${r.text}</span>
            <span class="rel-tag ${aMap[r.action]||'rt-hold'}">${aText[r.action]||''}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function renderPanelMine(d) {
  const mine = d.mine || [];
  if (!mine.length) return '';
  return `
    <div class="panel full-width">
      <h3><span class="dot" style="background:${PANEL_COLORS[d.key]}"></span>与我相关 · Portfolio Check</h3>
      <div style="font-size:13px;color:var(--sub);margin-bottom:10px;">基于${d.name}的框架，逐一审视你的持仓</div>
      ${mine.map(m => {
        const aMap = { buy:'rt-act', sell:'rt-warn', hold:'rt-hold', wait:'rt-wait', warn:'rt-warn' };
        const aText = { buy:'加仓', sell:'减仓', hold:'拿着', wait:'等待', warn:'注意' };
        return `<div class="rel-row" style="padding:6px 0;">
          <span style="font-size:11px;color:var(--sub);min-width:80px;flex-shrink:0;">${m.holding}</span>
          <span style="font-size:12px;flex:1;">${m.advice}</span>
          <span class="rel-tag ${aMap[m.action]||'rt-hold'}" style="flex-shrink:0;">${aText[m.action]||''}</span>
        </div>`;

  document.querySelector(`.tab.${key}`).classList.add('active');

}

function renderAll(data) {
  renderMarkets(data.markets, data.market_summary);
  renderPortfolio(data.portfolio);
  renderRelevance(data.relevance);

  // Signal map
  const signalDot = { bullish: '🟢', cautious: '🟡', bearish: '🔴', neutral: '⚪' };
  const signalMap = {};
  (data.signals||[]).forEach(s => { signalMap[s.emoji] = s.signal; });

  // Tabs with signal dots
  const order = ['shanren','eda','maoda'];
  document.getElementById('tabs').innerHTML = order.map(key => {
    const b = data.bloggers[key];
    if (!b) return '';
    const dot = signalDot[signalMap[b.emoji]] || '⚪';
    return `<div class="tab ${key}" onclick="switchTab('${key}')"><span style="font-size:12px;margin-right:4px;">${dot}</span>${b.name}</div>`;
  }).join('');

  // Panels
  document.getElementById('content').innerHTML = order.map(key => {
    const b = data.bloggers[key];
    if (!b) return '';
    return renderBloggerPanel(key, b);
  }).join('');

  // Activate first tab
  switchTab(order[0]);
  document.getElementById('footerTime').textContent = '更新: ' + (data.updated || '--');

  // Load sample if empty
  document.querySelectorAll('.blogger-panel').forEach(p => {
    if (p.textContent.trim().length < 50) p.innerHTML = '<div class="spinner">数据加载中...</div>';
  });
}

async function loadData() {
  try {
    const resp = await fetch(DATA_URL + '?t=' + Date.now());
    if (!resp.ok) throw new Error('No data');
    const data = await resp.json();
    renderAll(data);
  } catch(e) {

  }
}

    fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(sinaUrl))
      .then(r => r.text())
      .then(text => {
        const map = {};
        const re = /var hq_str_(\w+)="([^"]*)"/g;
        let m;
        while ((m = re.exec(text)) !== null) {
          const d = m[2].split(',');
          map[m[1]] = {f2:parseFloat(d[3])||parseFloat(d[1]), f3:parseFloat((parseFloat(d[3])-parseFloat(d[2]))/parseFloat(d[2])*100)||0};

        document.getElementById('refreshNote').textContent = '✅ 实时(Sina) ' + new Date().toLocaleTimeString();

        btn.disabled = false;
        document.getElementById('refreshNote').textContent = '⚠️ 网络不通，稍后再试';
      });
  }

  fetch(url)
    .then(function(r) { return r.json(); })

    if (!d) return;
    const price = d.f2 || 0;
    const pnlPct = ((price - cfg.cost) / cfg.cost * 100).toFixed(1);
    rows.push({name:cfg.name, price:price.toFixed(3), pnlPct:(pnlPct>0?'+':'')+pnlPct+'%', _down:pnlPct<0});
  });
  const pfGrid = document.getElementById('portfolioGrid');
  if (pfGrid && rows.length) {
    const existingLive = document.getElementById('livePfRows');
    if (existingLive) existingLive.remove();
    const div = document.createElement('div');
    div.id = 'livePfRows';
    div.innerHTML = `<div style="font-size:10px;color:var(--sub);margin-top:6px;padding-top:4px;border-top:1px solid var(--border);">📡 实时行情</div>` +
      rows.map(r => `<div class="pf-row" style="font-size:10px;"><span class="pf-name">${r.name}</span><span style="font-size:10px;color:var(--sub);min-width:40px;text-align:right;">${r.price}</span><span class="pf-pnl ${r._down?'pf-pnl-down':'pf-pnl-up'}" style="min-width:50px;text-align:right;">${r.pnlPct}</span></div>`).join('');
    pfGrid.appendChild(div);
  }
}

window.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
