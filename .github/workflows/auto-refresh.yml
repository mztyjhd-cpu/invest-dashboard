name: 自动刷新仪表盘

on:
  schedule:
    # 每30分钟刷新一次
    - cron: '*/30 * * * *'
  # 也支持手动触发
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 刷新数据
        run: python auto_refresh.py
